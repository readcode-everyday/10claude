services:

  caddy:
    container_name: caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ~/10claude/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_certs:/config
    # Note: Caddy only needs its own config, not the app directory
    environment:
      - UI_USER=${UI_USER}
      - UI_PASS_HASH=${UI_PASS_HASH}
    depends_on:
      - openclaw


  openclaw:
    container_name: openclaw
    build: .
    working_dir: /app

    env_file: .env
    environment:
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL}

    volumes:
      - ~/10claude:/app
      - ~/.ssh:/root/.ssh:ro
      - ~/.claude:/root/.claude
      - ~/.codex:/root/.codex

    command: >
      bash -c "
        pip install -q -e /app &&
        uvicorn openclaw.tools.status_ui:app --host 0.0.0.0 --port 18888
      "

    ports:
      - "18888:18888"

    restart: unless-stopped


  runtime-daemon:
    container_name: runtime-daemon
    build: .
    working_dir: /app

    env_file: .env
    environment:
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL}

    volumes:
      - ~/10claude:/app
      - ~/.ssh:/root/.ssh:ro
      - ~/.claude:/root/.claude
      - ~/.codex:/root/.codex
      - /var/run/docker.sock:/var/run/docker.sock

    command: >
      bash -c "
        pip install -q -e /app &&
        python -u -m openclaw.tools.runtime_engine
      "

    restart: unless-stopped


volumes:
  caddy_data:
  caddy_certs:
