services:

  caddy:
    container_name: caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ~/10claude/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_certs:/config
    environment:
      - UI_USER=${UI_USER}
      - UI_PASS_HASH=${UI_PASS_HASH}
    depends_on:
      - status-ui


  status-ui:
    container_name: status-ui
    build: .
    working_dir: /app

    env_file: .env
    environment:
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL}
      # openclaw gateway runs on host — use host.docker.internal to reach it
      - OPENCLAW_GATEWAY_URL=http://host.docker.internal:18789
      # Token is auto-read from ~/.openclaw/openclaw.json (mounted below)
      # Override with OPENCLAW_GATEWAY_TOKEN env var if preferred

    volumes:
      - ~/10claude:/app
      - ~/.ssh:/root/.ssh:ro
      - ~/.claude:/root/.claude
      - ~/.openclaw:/root/.openclaw:ro   # read openclaw.json for gateway token

    command: >
      bash -c "
        pip install -q -e /app &&
        uvicorn openclaw.tools.status_ui:app --host 0.0.0.0 --port 18888
      "

    ports:
      - "18888:18888"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

    restart: unless-stopped


volumes:
  caddy_data:
  caddy_certs:
