services:

  caddy:
    container_name: caddy
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ~/10claude/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_certs:/config
    environment:
      - UI_USER=${UI_USER}
      - UI_PASS_HASH=${UI_PASS_HASH}
    depends_on:
      - status-ui


  status-ui:
    container_name: status-ui
    build: .
    working_dir: /app
    env_file: .env
    environment:
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL}
      # Host user IDs so project_manager can chown created repos to the real user
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      # GitHub integration
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USER=${GIT_AUTHOR_NAME}
    volumes:
      - ~/10claude:/app
      - ~/.ssh:/root/.ssh:ro
      - ~/.claude:/root/.claude
      - ~/.openclaw:/root/.openclaw:ro
    command: >
      bash -c "
        pip install -q -e /app &&
        uvicorn openclaw.tools.status_ui:app --host 0.0.0.0 --port 18888
      "
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped


  # ── Parallel Claude workers ────────────────────────────────────────────────
  # Each worker polls workspace/queue/task_store.json every 5s,
  # atomically claims a pending task, runs it via the claude CLI,
  # then loops. Three run in parallel; each gets 6 CPUs and 6 GB RAM.

  worker-1:
    container_name: worker-1
    image: openclaw-sandbox:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - WORKER_ID=worker-1
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USER=${GIT_AUTHOR_NAME}
    volumes:
      - ~/10claude/workspace:/app/workspace
      - ~/10claude/scripts:/app/scripts:ro
      - ~/.claude:/home/worker/.claude
      - ~/.claude.json:/home/worker/.claude.json
      - ~/.ssh:/home/worker/.ssh:ro
    command: >
      bash -c "
        git config --global user.name  \"$${GIT_AUTHOR_NAME}\" &&
        git config --global user.email \"$${GIT_AUTHOR_EMAIL}\" &&
        python3 /app/scripts/worker.py
      "
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 6G

  worker-2:
    container_name: worker-2
    image: openclaw-sandbox:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - WORKER_ID=worker-2
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL}
    volumes:
      - ~/10claude/workspace:/app/workspace
      - ~/10claude/scripts:/app/scripts:ro
      - ~/.claude:/home/worker/.claude
      - ~/.claude.json:/home/worker/.claude.json
      - ~/.ssh:/home/worker/.ssh:ro
    command: >
      bash -c "
        git config --global user.name  \"$${GIT_AUTHOR_NAME}\" &&
        git config --global user.email \"$${GIT_AUTHOR_EMAIL}\" &&
        python3 /app/scripts/worker.py
      "
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 6G

  worker-3:
    container_name: worker-3
    image: openclaw-sandbox:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - WORKER_ID=worker-3
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL}
    volumes:
      - ~/10claude/workspace:/app/workspace
      - ~/10claude/scripts:/app/scripts:ro
      - ~/.claude:/home/worker/.claude
      - ~/.claude.json:/home/worker/.claude.json
      - ~/.ssh:/home/worker/.ssh:ro
    command: >
      bash -c "
        git config --global user.name  \"$${GIT_AUTHOR_NAME}\" &&
        git config --global user.email \"$${GIT_AUTHOR_EMAIL}\" &&
        python3 /app/scripts/worker.py
      "
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 6G


volumes:
  caddy_data:
  caddy_certs:
