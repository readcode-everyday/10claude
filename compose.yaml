services:

  openclaw:
    container_name: openclaw
    build: .
    working_dir: /app

    env_file: .env
    environment:
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL}

    volumes:
      - ~/10claude/workspace:/workspace
      - ~/10claude/logs:/logs
      - ~/10claude/openclaw:/app/openclaw
      - ~/10claude/config:/app/config
      - ~/.ssh:/root/.ssh:ro
      - ~/.claude:/root/.claude
      - ~/.codex:/root/.codex

    command: >
      bash -c "
        pip install -q -e /app &&
        uvicorn openclaw.tools.status_ui:app --host 0.0.0.0 --port 18888
      "

    ports:
      - "18888:18888"

    restart: unless-stopped


  runtime-daemon:
    container_name: runtime-daemon
    build: .
    working_dir: /app

    env_file: .env
    environment:
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL}

    volumes:
      - ~/10claude/workspace:/workspace
      - ~/10claude/backups:/backups
      - ~/10claude/logs:/logs
      - ~/10claude/openclaw:/app/openclaw
      - ~/10claude/config:/app/config
      - ~/.ssh:/root/.ssh:ro
      - ~/.claude:/root/.claude
      - ~/.codex:/root/.codex
      - /var/run/docker.sock:/var/run/docker.sock

    command: >
      bash -c "
        pip install -q -e /app &&
        python -u -m openclaw.tools.runtime_engine
      "

    restart: unless-stopped
