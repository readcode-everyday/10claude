<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenClaw — Task Manager</title>
<script src="https://cdn.jsdelivr.net/npm/marked@11/marked.min.js"></script>
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface2: #f8f9fa;
  --border: #e2e8f0;
  --text: #1a202c;
  --text2: #64748b;
  --text3: #94a3b8;
  --primary: #6366f1;
  --primary-bg: #eef2ff;
  --green: #16a34a;
  --green-bg: #f0fdf4;
  --blue: #2563eb;
  --blue-bg: #eff6ff;
  --purple: #7c3aed;
  --purple-bg: #f5f3ff;
  --red: #dc2626;
  --red-bg: #fff1f2;
  --gray: #6b7280;
  --gray-bg: #f9fafb;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.12);
  --radius: 10px;
  --radius-sm: 6px;
}
[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #22263a;
  --border: #2d3148;
  --text: #e8eaf0;
  --text2: #8892b0;
  --text3: #4a5568;
  --primary-bg: #1e1b4b;
  --green-bg: #052e16;
  --blue-bg: #0c1a3a;
  --purple-bg: #1e1040;
  --red-bg: #2d0a0a;
  --gray-bg: #111318;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
       background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

/* ── Header ── */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; background: var(--surface);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.logo { width: 36px; height: 36px; background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border-radius: 8px; display: flex; align-items: center; justify-content: center;
        font-size: 18px; }
h1 { font-size: 16px; font-weight: 600; }
.task-count { font-size: 12px; color: var(--text2); }
.header-right { display: flex; gap: 8px; }
.icon-btn { background: var(--surface2); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 6px 10px; cursor: pointer;
            color: var(--text2); font-size: 14px; transition: all .15s; }
.icon-btn:hover { background: var(--border); color: var(--text); }

/* ── Input Area ── */
.input-area {
  margin: 16px 20px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
}
.textarea-wrap { position: relative; }
textarea#task-input {
  width: 100%; min-height: 72px; resize: vertical;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 44px 10px 12px; font-size: 14px; font-family: inherit;
  background: var(--surface); color: var(--text); outline: none; transition: border .15s;
}
textarea#task-input:focus { border-color: var(--primary); }
textarea#task-input::placeholder { color: var(--text3); }
#mic-btn { position: absolute; right: 10px; top: 10px;
           background: none; border: none; cursor: pointer; font-size: 18px;
           color: var(--text2); padding: 2px; }
#mic-btn.recording { color: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

.input-row { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.input-row label { font-size: 12px; color: var(--text2); white-space: nowrap; }
select {
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 5px 8px; background: var(--surface); color: var(--text);
  font-size: 13px; cursor: pointer; flex: 1; min-width: 0;
}
.plan-mode-label { display: flex; align-items: center; gap: 6px; cursor: pointer;
                   font-size: 13px; color: var(--text2); white-space: nowrap; }
.plan-mode-label input { accent-color: var(--purple); }
.shortcuts-hint { font-size: 11px; color: var(--text3); margin-left: auto; }
.btn-add {
  padding: 8px 20px; background: var(--primary); color: white; border: none;
  border-radius: var(--radius-sm); font-size: 14px; font-weight: 500;
  cursor: pointer; transition: opacity .15s; white-space: nowrap;
}
.btn-add:hover { opacity: .88; }
.btn-add:disabled { opacity: .5; cursor: not-allowed; }

/* ── Kanban ── */
.kanban { display: flex; gap: 12px; padding: 0 20px 20px; overflow-x: auto;
          min-height: calc(100vh - 280px); }
.column { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 8px; }
.col-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase;
}
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
  font-size: 11px; font-weight: 700;
}
.col-pending   .col-header { color: var(--gray); }
.col-pending   .badge { background: #e5e7eb; color: var(--gray); }
.col-in_progress .col-header { color: var(--blue); }
.col-in_progress .badge { background: var(--blue-bg); color: var(--blue); }
.col-review    .col-header { color: var(--purple); }
.col-review    .badge { background: var(--purple-bg); color: var(--purple); }
.col-completed .col-header { color: var(--green); }
.col-completed .badge { background: var(--green-bg); color: var(--green); }
.col-failed    .col-header { color: var(--red); }
.col-failed    .badge { background: var(--red-bg); color: var(--red); }
.col-cancelled .col-header { color: var(--text3); }
.col-cancelled .badge { background: var(--border); color: var(--text3); }

.col-body { display: flex; flex-direction: column; gap: 8px; }
.empty-col { padding: 20px 8px; text-align: center; color: var(--text3); font-size: 12px; }

/* ── Cards ── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow);
  cursor: default; transition: box-shadow .15s;
}
.card:hover { box-shadow: var(--shadow-lg); }
.card-review    { border-left: 3px solid var(--purple); background: var(--purple-bg); }
.card-in_progress { border-left: 3px solid var(--blue); }
.card-failed    { border-left: 3px solid var(--red); background: var(--red-bg); }
.card-completed { border-left: 3px solid var(--green); }

.card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.task-id { font-size: 11px; font-weight: 700; color: var(--text3); font-family: monospace; }
.status-badge {
  font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px;
  text-transform: uppercase; letter-spacing: .04em;
}
.badge-review    { background: var(--purple-bg); color: var(--purple); }
.badge-pending   { background: #e5e7eb; color: var(--gray); }
.badge-in_progress { background: var(--blue-bg); color: var(--blue); }
.badge-completed { background: var(--green-bg); color: var(--green); }
.badge-failed    { background: var(--red-bg); color: var(--red); }
.badge-cancelled { background: var(--border); color: var(--text3); }
.plan-tag { font-size: 10px; padding: 2px 6px; border-radius: 10px;
            background: var(--purple-bg); color: var(--purple); font-weight: 600; }
.card-actions { margin-left: auto; display: flex; gap: 4px; }
.action-btn {
  background: none; border: none; cursor: pointer; padding: 2px 5px;
  border-radius: 4px; color: var(--text3); font-size: 14px; transition: all .1s;
}
.action-btn:hover { background: var(--border); color: var(--text); }
.action-btn.danger:hover { background: var(--red-bg); color: var(--red); }

.card-prompt { font-size: 13px; color: var(--text); line-height: 1.5;
               display: -webkit-box; -webkit-line-clamp: 4;
               -webkit-box-orient: vertical; overflow: hidden; }
.card-prompt.expanded { -webkit-line-clamp: unset; overflow: visible; }
.card-footer { display: flex; align-items: center; justify-content: space-between;
               margin-top: 10px; }
.card-time { font-size: 11px; color: var(--text3); }

.card-expanded { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.card-expanded .prose { font-size: 12px; color: var(--text2); max-height: 200px;
                        overflow-y: auto; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  display: flex; align-items: flex-start; justify-content: center;
  z-index: 1000; padding: 20px; overflow-y: auto;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--surface); border-radius: 12px; width: 100%; max-width: 800px;
  box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
  max-height: calc(100vh - 40px); overflow: hidden;
}
.modal-header {
  display: flex; align-items: center; gap: 10px; padding: 16px 20px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.modal-title { font-size: 14px; font-weight: 500; color: var(--text); flex: 1;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer;
               color: var(--text2); padding: 0 4px; line-height: 1; }
.modal-body { flex: 1; overflow-y: auto; padding: 20px; }

/* ── Prose (markdown) ── */
.prose h1 { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
.prose h2 { font-size: 15px; font-weight: 600; margin: 16px 0 8px; }
.prose h3 { font-size: 14px; font-weight: 600; margin: 12px 0 6px; }
.prose p  { margin-bottom: 8px; }
.prose ul, .prose ol { padding-left: 20px; margin-bottom: 8px; }
.prose li { margin-bottom: 4px; }
.prose code { background: var(--surface2); padding: 1px 5px; border-radius: 4px;
              font-size: 12px; font-family: 'Menlo', monospace; }
.prose pre { background: var(--surface2); border: 1px solid var(--border);
             border-radius: var(--radius-sm); padding: 12px; margin: 8px 0;
             overflow-x: auto; }
.prose pre code { background: none; padding: 0; }
.prose strong { font-weight: 600; }

/* ── Questions ── */
.questions-section {
  margin-top: 20px; background: var(--blue-bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
}
.questions-title { font-size: 13px; font-weight: 600; color: var(--blue);
                   margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
.question-block { margin-bottom: 16px; }
.question-block:last-child { margin-bottom: 0; }
.question-text { font-size: 13px; font-weight: 500; margin-bottom: 8px; }
.options { display: flex; flex-wrap: wrap; gap: 8px; }
.option-btn {
  padding: 6px 12px; border: 1.5px solid var(--border); border-radius: 20px;
  background: var(--surface); color: var(--text); font-size: 12px;
  cursor: pointer; transition: all .15s; text-align: left; line-height: 1.4;
}
.option-btn:hover { border-color: var(--blue); color: var(--blue); }
.option-btn.selected { border-color: var(--blue); background: var(--blue-bg);
                       color: var(--blue); font-weight: 500; }

/* ── Feedback ── */
.feedback-area { margin-top: 16px; display: none; }
.feedback-area.visible { display: block; }
.feedback-area textarea {
  width: 100%; min-height: 60px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px;
  font-family: inherit; background: var(--surface); color: var(--text);
  resize: vertical; outline: none;
}
.feedback-area textarea:focus { border-color: var(--primary); }

/* ── Modal Footer ── */
.modal-footer {
  display: flex; gap: 10px; padding: 16px 20px;
  border-top: 1px solid var(--border); flex-shrink: 0;
}
.btn-primary { padding: 9px 20px; background: var(--green); color: white;
               border: none; border-radius: var(--radius-sm); font-size: 14px;
               font-weight: 500; cursor: pointer; transition: opacity .15s; }
.btn-primary:hover { opacity: .88; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-secondary { padding: 9px 16px; background: var(--purple-bg); color: var(--purple);
                 border: 1.5px solid var(--purple); border-radius: var(--radius-sm);
                 font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
.btn-secondary:hover { opacity: .8; }
.btn-tertiary { padding: 9px 16px; background: var(--surface2); color: var(--text2);
                border: 1px solid var(--border); border-radius: var(--radius-sm);
                font-size: 14px; cursor: pointer; transition: all .15s; margin-left: auto; }
.btn-tertiary:hover { background: var(--border); }

/* ── Spinner ── */
.spinner { display: inline-block; width: 16px; height: 16px;
           border: 2px solid var(--border); border-top-color: var(--primary);
           border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-state { display: flex; align-items: center; gap: 8px;
                 color: var(--text2); font-size: 13px; padding: 8px 0; }

/* ── Toasts ── */
#toasts { position: fixed; bottom: 20px; right: 20px; z-index: 2000;
          display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13px;
         background: var(--text); color: var(--surface); box-shadow: var(--shadow-lg);
         animation: slideIn .2s ease; max-width: 300px; }
.toast.success { background: var(--green); }
.toast.error   { background: var(--red); }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; }
                     to   { transform: translateY(0);    opacity: 1; } }
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-left">
    <div class="logo">🐾</div>
    <div>
      <h1>OpenClaw Dev Manager</h1>
      <div class="task-count" id="task-count">0 tasks</div>
    </div>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="theme-btn" title="Toggle dark mode">🌙</button>
  </div>
</header>

<!-- Input Area -->
<div class="input-area">
  <div class="textarea-wrap">
    <textarea id="task-input" placeholder="Add new task... (Cmd/Ctrl+Enter to submit)"></textarea>
    <button id="mic-btn" title="Voice input">🎤</button>
  </div>
  <div class="input-row" style="margin-top:10px">
    <label>Prerequisite:</label>
    <select id="depends-on" style="max-width:220px">
      <option value="">None (start immediately)</option>
    </select>
    <label style="margin-left:8px">Project:</label>
    <select id="project-select" style="max-width:180px">
      <option value="">None</option>
    </select>
    <label class="plan-mode-label" style="margin-left:8px">
      <input type="checkbox" id="plan-mode"> ✦ Plan Mode
    </label>
    <span class="shortcuts-hint">Enter = newline &nbsp;|&nbsp; Cmd/Ctrl+Enter = submit</span>
    <button class="btn-add" id="submit-btn">Add</button>
  </div>
</div>

<!-- Kanban Board -->
<div class="kanban">
  <div class="column col-pending">
    <div class="col-header"><span>Pending</span><span class="badge" id="badge-pending">0</span></div>
    <div class="col-body" id="body-pending"></div>
  </div>
  <div class="column col-in_progress">
    <div class="col-header"><span>In Dev</span><span class="badge" id="badge-in_progress">0</span></div>
    <div class="col-body" id="body-in_progress"></div>
  </div>
  <div class="column col-review">
    <div class="col-header"><span>Review</span><span class="badge" id="badge-review">0</span></div>
    <div class="col-body" id="body-review"></div>
  </div>
  <div class="column col-completed">
    <div class="col-header"><span>Completed</span><span class="badge" id="badge-completed">0</span></div>
    <div class="col-body" id="body-completed"></div>
  </div>
  <div class="column col-failed">
    <div class="col-header"><span>Failed</span><span class="badge" id="badge-failed">0</span></div>
    <div class="col-body" id="body-failed"></div>
  </div>
  <div class="column col-cancelled">
    <div class="col-header"><span>Cancelled</span><span class="badge" id="badge-cancelled">0</span></div>
    <div class="col-body" id="body-cancelled"></div>
  </div>
</div>

<!-- Plan Review Modal -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span class="status-badge badge-review" id="modal-status-badge">Review</span>
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" id="modal-close">×</button>
    </div>
    <div class="modal-body">
      <div class="prose" id="modal-plan"></div>
      <div class="questions-section" id="modal-questions" style="display:none">
        <div class="questions-title">⊙ Claude's Questions <span style="font-weight:400;color:var(--text2)">(please answer before confirming)</span></div>
        <div id="questions-body"></div>
      </div>
      <div class="feedback-area" id="feedback-area">
        <textarea id="feedback-input" placeholder="Describe what you'd like changed or clarified..."></textarea>
        <div style="margin-top:8px;display:flex;gap:8px">
          <button class="btn-secondary" id="regen-btn" style="font-size:13px;padding:6px 14px">↺ Regenerate Plan</button>
          <button class="btn-tertiary" id="cancel-feedback-btn" style="font-size:13px;padding:6px 14px;margin-left:0">Cancel</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-primary" id="confirm-btn">✓ Confirm & Create Task</button>
      <button class="btn-secondary" id="feedback-btn">✎ Modify Feedback</button>
      <button class="btn-tertiary" id="close-modal-btn">Exit</button>
    </div>
  </div>
</div>

<!-- Toasts -->
<div id="toasts"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let tasks = [];
let projects = [];
let expandedCards = new Set();
let currentTaskId = null;   // task open in modal
let currentAnswers = {};    // question answers for modal
let pollTimer = null;

// ── Utils ──────────────────────────────────────────────────────────────────────
function relTime(iso) {
  if (!iso) return '';
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60)   return `${Math.floor(diff)}s ago`;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;');
}

function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ── API ────────────────────────────────────────────────────────────────────────
async function apiFetch(url, opts={}) {
  const r = await fetch(url, {headers: {'Content-Type':'application/json'}, ...opts});
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

// ── Render ─────────────────────────────────────────────────────────────────────
const STATUS_LABEL = {
  pending:'Pending', in_progress:'In Dev', review:'Review',
  completed:'Done', failed:'Failed', cancelled:'Cancelled'
};
const COLUMNS = ['pending','in_progress','review','completed','failed','cancelled'];

function renderKanban(taskList) {
  const groups = {};
  COLUMNS.forEach(s => groups[s] = []);
  taskList.forEach(t => { if (groups[t.status]) groups[t.status].push(t); });

  document.getElementById('task-count').textContent =
    `${taskList.length} task${taskList.length !== 1 ? 's' : ''}`;

  COLUMNS.forEach(status => {
    const list = groups[status];
    document.getElementById(`badge-${status}`).textContent = list.length;
    const body = document.getElementById(`body-${status}`);
    if (list.length === 0) {
      body.innerHTML = '<div class="empty-col">No tasks</div>';
    } else {
      body.innerHTML = list.map(renderCard).join('');
    }
  });

  // Populate prerequisite dropdown
  const sel = document.getElementById('depends-on');
  const cur = sel.value;
  const completed = taskList.filter(t => t.status === 'completed');
  sel.innerHTML = '<option value="">None (start immediately)</option>' +
    completed.map(t => `<option value="${esc(t.id)}" ${cur===t.id?'selected':''}>${esc(t.id)} — ${esc(t.prompt.slice(0,40))}</option>`).join('');
}

function renderCard(t) {
  const isExpanded = expandedCards.has(t.id);
  const shortId = t.id.replace('task-','');
  const isPlan = !!t.plan;

  const actions = [];
  if (t.status === 'review') {
    actions.push(`<button class="action-btn" onclick="openModal('${t.id}')" title="Review plan">⊞</button>`);
  }
  if (t.status === 'failed') {
    actions.push(`<button class="action-btn" onclick="retryTask('${t.id}')" title="Retry">↺</button>`);
    actions.push(`<button class="action-btn danger" onclick="cancelTask('${t.id}')" title="Delete">🗑</button>`);
  }
  if (['pending','review'].includes(t.status)) {
    actions.push(`<button class="action-btn danger" onclick="cancelTask('${t.id}')" title="Cancel">×</button>`);
  }
  actions.push(`<button class="action-btn" onclick="toggleCard('${t.id}')" title="${isExpanded?'Collapse':'Expand'}">${isExpanded?'∧':'∨'}</button>`);

  const expandedHtml = isExpanded ? `
    <div class="card-expanded">
      <div class="prose">${isPlan ? marked.parse(t.plan) : esc(t.prompt)}</div>
      ${t.result ? `<div style="margin-top:8px;font-size:11px;color:var(--text3)">
        ${t.result.success ? '✓ Success' : '✗ Failed'} · ${t.result.subgoals ? t.result.subgoals.length + ' sub-goals' : ''}
      </div>` : ''}
    </div>` : '';

  return `<div class="card card-${t.status}" id="card-${t.id}">
    <div class="card-top">
      <span class="task-id">#${esc(shortId)}</span>
      ${isPlan ? '<span class="plan-tag">Plan</span>' : ''}
      <span class="status-badge badge-${t.status}">${STATUS_LABEL[t.status]||t.status}</span>
      <div class="card-actions">${actions.join('')}</div>
    </div>
    <p class="card-prompt${isExpanded?' expanded':''}">${esc(t.prompt)}</p>
    ${expandedHtml}
    <div class="card-footer">
      <span class="card-time">${relTime(t.created_at)}</span>
      ${t.depends_on ? `<span style="font-size:11px;color:var(--text3)">after #${esc(t.depends_on.replace('task-',''))}</span>` : ''}
    </div>
  </div>`;
}

// ── Card expand/collapse ───────────────────────────────────────────────────────
function toggleCard(id) {
  if (expandedCards.has(id)) expandedCards.delete(id);
  else expandedCards.add(id);
  renderKanban(tasks);
}

// ── Modal ──────────────────────────────────────────────────────────────────────
function openModal(taskId) {
  const t = tasks.find(x => x.id === taskId);
  if (!t) return;
  currentTaskId = taskId;
  currentAnswers = { ...(t.answers || {}) };

  document.getElementById('modal-title').textContent = t.prompt;
  document.getElementById('modal-plan').innerHTML = t.plan ? marked.parse(t.plan) : '<em>No plan available</em>';
  document.getElementById('modal-status-badge').textContent = STATUS_LABEL[t.status] || t.status;
  document.getElementById('modal-status-badge').className = `status-badge badge-${t.status}`;

  renderQuestions(t.questions || []);
  hideFeedback();

  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  currentTaskId = null;
  currentAnswers = {};
}

function renderQuestions(questions) {
  const section = document.getElementById('modal-questions');
  const body = document.getElementById('questions-body');
  if (!questions.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  body.innerHTML = questions.map((q, qi) => `
    <div class="question-block">
      <div class="question-text">${esc(q.question)}</div>
      <div class="options">
        ${q.options.map((opt, oi) => `
          <button class="option-btn ${currentAnswers[qi]===oi?'selected':''}"
                  onclick="selectOption(${qi},${oi},this)">
            ${esc(opt)}
          </button>`).join('')}
      </div>
    </div>`).join('');
}

function selectOption(qi, oi, btn) {
  currentAnswers[qi] = oi;
  const block = btn.closest('.question-block');
  block.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function showFeedback() {
  document.getElementById('feedback-area').classList.add('visible');
  document.getElementById('feedback-input').focus();
}

function hideFeedback() {
  document.getElementById('feedback-area').classList.remove('visible');
  document.getElementById('feedback-input').value = '';
}

async function regenPlan() {
  if (!currentTaskId) return;
  const feedback = document.getElementById('feedback-input').value.trim();
  const btn = document.getElementById('regen-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Regenerating...';
  try {
    const updated = await apiFetch(`/api/replan/${currentTaskId}`, {
      method: 'POST',
      body: JSON.stringify({ feedback, prompt: '' })
    });
    // Refresh tasks and reopen modal
    await loadTasks();
    openModal(currentTaskId);
    hideFeedback();
    toast('Plan regenerated', 'success');
  } catch(e) {
    toast('Regeneration failed: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '↺ Regenerate Plan';
  }
}

async function confirmTask() {
  if (!currentTaskId) return;
  const btn = document.getElementById('confirm-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Submitting...';
  try {
    await apiFetch(`/api/confirm/${currentTaskId}`, {
      method: 'POST',
      body: JSON.stringify({ answers: currentAnswers })
    });
    toast('Task submitted to queue', 'success');
    closeModal();
    await loadTasks();
  } catch(e) {
    toast('Failed: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '✓ Confirm & Create Task';
  }
}

// ── Submit ─────────────────────────────────────────────────────────────────────
async function submitTask() {
  const prompt = document.getElementById('task-input').value.trim();
  if (!prompt) { toast('Please enter a task', 'error'); return; }

  const planMode  = document.getElementById('plan-mode').checked;
  const project   = document.getElementById('project-select').value;
  const dependsOn = document.getElementById('depends-on').value || null;
  const btn = document.getElementById('submit-btn');

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    if (planMode) {
      toast('Generating plan...');
      const t = await apiFetch('/api/plan', {
        method: 'POST',
        body: JSON.stringify({ prompt, project_path: project, depends_on: dependsOn })
      });
      document.getElementById('task-input').value = '';
      await loadTasks();
      openModal(t.id);
      toast('Plan ready — please review', 'success');
    } else {
      await apiFetch('/api/submit', {
        method: 'POST',
        body: JSON.stringify({ prompt, project_path: project, depends_on: dependsOn })
      });
      document.getElementById('task-input').value = '';
      await loadTasks();
      toast('Task queued', 'success');
    }
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Add';
  }
}

// ── Task Actions ───────────────────────────────────────────────────────────────
async function retryTask(id) {
  try {
    await apiFetch(`/api/retry/${id}`, { method: 'POST' });
    toast('Task requeued', 'success');
    await loadTasks();
  } catch(e) { toast('Failed: ' + e.message, 'error'); }
}

async function cancelTask(id) {
  try {
    await apiFetch(`/api/tasks/${id}`, { method: 'DELETE' });
    toast('Task cancelled');
    await loadTasks();
  } catch(e) { toast('Failed: ' + e.message, 'error'); }
}

// ── Data Loading ───────────────────────────────────────────────────────────────
async function loadTasks() {
  try {
    tasks = await apiFetch('/api/tasks');
    renderKanban(tasks);
  } catch(e) { console.warn('Failed to load tasks:', e); }
}

async function loadProjects() {
  try {
    projects = await apiFetch('/api/projects');
    const sel = document.getElementById('project-select');
    sel.innerHTML = '<option value="">None</option>' +
      projects.map(p => `<option value="/workspace/projects/${esc(p)}">${esc(p)}</option>`).join('');
  } catch(e) { console.warn('Failed to load projects:', e); }
}

// ── Voice Input ────────────────────────────────────────────────────────────────
let recognition = null;
function initMic() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { document.getElementById('mic-btn').style.display='none'; return; }
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = e => {
    const txt = e.results[0][0].transcript;
    const ta = document.getElementById('task-input');
    ta.value = (ta.value ? ta.value + ' ' : '') + txt;
    document.getElementById('mic-btn').classList.remove('recording');
  };
  recognition.onend = () => document.getElementById('mic-btn').classList.remove('recording');
}

function toggleMic() {
  if (!recognition) return;
  const btn = document.getElementById('mic-btn');
  if (btn.classList.contains('recording')) {
    recognition.stop();
    btn.classList.remove('recording');
  } else {
    recognition.start();
    btn.classList.add('recording');
  }
}

// ── Dark Mode ──────────────────────────────────────────────────────────────────
function initTheme() {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('theme-btn').textContent = saved === 'dark' ? '☀️' : '🌙';
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.getElementById('theme-btn').textContent = next === 'dark' ? '☀️' : '🌙';
}

// ── Event Listeners ────────────────────────────────────────────────────────────
document.getElementById('submit-btn').addEventListener('click', submitTask);
document.getElementById('theme-btn').addEventListener('click', toggleTheme);
document.getElementById('mic-btn').addEventListener('click', toggleMic);
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('close-modal-btn').addEventListener('click', closeModal);
document.getElementById('confirm-btn').addEventListener('click', confirmTask);
document.getElementById('feedback-btn').addEventListener('click', showFeedback);
document.getElementById('cancel-feedback-btn').addEventListener('click', hideFeedback);
document.getElementById('regen-btn').addEventListener('click', regenPlan);

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

document.getElementById('task-input').addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    submitTask();
  }
});

// ── Init ───────────────────────────────────────────────────────────────────────
initTheme();
initMic();
loadProjects();
loadTasks();
pollTimer = setInterval(loadTasks, 3000);
</script>
</body>
